<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WojakMeter · Touch Studio 16</title>
<style>
:root{
  --bg:#0a0b0f; --panel:#12141b; --line:#232735;
  --ink:#e8eaf0; --dim:#8b93a7; --faint:#565e73;
  --frustration:#E4485C; --concern:#E8848F; --doubt:#CBA5AB;
  --neutral:#B8C0CB; --optimism:#B8E5D0; --content:#7FD9A0; --euphoria:#3BD97A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:20px;
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
h1{font-size:19px;font-weight:650;letter-spacing:-.02em;margin:0 0 4px}
p.sub{color:var(--dim);font-size:13px;margin:0 0 16px;max-width:76ch}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start;max-width:1280px}

/* El escenario es TRANSPARENTE a proposito: asi se ve como quedara
   incrustado en la pagina, sobre el fondo que haya detras. El
   tablero de cuadros lo hace evidente. */
#stage{position:relative;aspect-ratio:4/5;max-height:80vh;border-radius:16px;
  border:1px solid var(--line);overflow:hidden;
  background:
    linear-gradient(45deg,#171a22 25%,transparent 25%,transparent 75%,#171a22 75%),
    linear-gradient(45deg,#171a22 25%,#0e1017 25%,#0e1017 75%,#171a22 75%);
  background-size:22px 22px;background-position:0 0,11px 11px}
#stage.liso{background:#0d1017}
#stage canvas{display:block;width:100%;height:100%}
#cargando{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);
  font-size:12px;letter-spacing:.1em;text-transform:uppercase}
#mood{position:absolute;left:16px;bottom:14px;font-size:28px;font-weight:700;
  letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#score{position:absolute;right:16px;bottom:18px;font-size:13px;color:var(--dim)}

aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;position:sticky;top:18px;max-height:90vh;overflow:auto}
aside h2{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin:16px 0 8px;font-weight:600}
aside h2:first-child{margin-top:0}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:10px}
.ctl label{font-size:11.5px;color:var(--dim)}
.ctl output{font-size:11px}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:#26d07c;margin:0}
.ctl .why{grid-column:1/-1;font-size:10.5px;color:var(--faint);line-height:1.45}
select,button{font:inherit;font-size:12px;color:var(--ink);background:#1a1d27;
  border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%}
button{cursor:pointer;margin-top:8px}
button:hover{border-color:#3d4870}
.morfos{font-size:10.5px;line-height:1.7;color:var(--faint)}
.morfos b{color:var(--dim);font-weight:500}
@media (max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none}}
body{font-size:16px} .ctl label,select,button{font-size:14px} .sub{font-size:14px!important} .views{display:grid;grid-template-columns:1fr 1fr;gap:6px} #stage.liso{background:#050709} </style>
<style>body{padding:0;margin:0;background:transparent;overflow:hidden}body>h1,body>p,aside,#mood,#score{display:none!important}.wrap{display:block;max-width:none}#stage{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;border:0;border-radius:0;background:transparent!important}</style><style>#stage{height:calc(100vh - 112px)!important}#wmToolbar{position:fixed;bottom:0;left:0;right:0;height:112px;box-sizing:border-box;padding:8px 12px;background:rgba(10,15,22,.9);border-top:1px solid #ffffff12;display:grid;gap:5px;z-index:30}#wmToolbar .wmViewRow{display:flex;gap:5px}#wmToolbar button{margin:0;padding:5px;font-size:12px}#wmToolbar select{padding:4px;font-size:12px}#wmPreviewStatus{font-size:10px;color:#a6b9ae;text-align:center}</style><style>#wmLightToggle{position:fixed;right:14px;top:12px;width:auto;z-index:80;padding:9px 13px;background:#172331;border:1px solid #8babc566}#wmLightPanel{position:fixed;right:10px;top:62px;bottom:14px;width:min(335px,calc(100vw - 40px));box-sizing:border-box;z-index:90;background:#111923f5;border:1px solid #668098;padding:16px;border-radius:12px;overflow:auto;box-shadow:0 12px 50px #0008;font-size:12px}#wmLightPanel[hidden]{display:none}#wmLightPanel h3{margin:0 0 8px}#wmLightPanel p{color:#96a4b4;font-size:11px}#wmLightPanel details{margin:12px 0;padding:10px 0;border-top:1px solid #ffffff20}#wmLightPanel summary{cursor:pointer;font-weight:600;color:#d7e6f5}.lightRange{display:grid;grid-template-columns:1fr auto;gap:4px;margin:13px 0}.lightRange input{grid-column:1/-1;width:100%;accent-color:#8cd5b2}.lightPresets{display:flex;gap:5px}#wmLightPanel input[type=color]{height:30px;width:100%;background:none;border:0}</style><style>#wmFXToggle{position:fixed;right:14px;top:55px;width:auto;z-index:81;padding:9px 13px;background:#192334;border:1px solid #a0c9b866}#wmFXPanel{position:fixed;right:10px;top:100px;bottom:12px;width:min(335px,calc(100vw - 40px));box-sizing:border-box;z-index:95;background:#111923fa;border:1px solid #77a995;padding:16px;border-radius:12px;overflow:auto;font-size:12px}#wmFXPanel[hidden]{display:none}#wmFXPanel p{font-size:11px;color:#a7b9ba}#wmFXPanel h3{margin:0 0 8px}#wmFXPanel select{margin-top:14px}#wmFXPanel input[type=color]{width:100%;height:32px;margin-top:12px}#wmFXPanel input[type=file]{max-width:100%;font-size:11px;margin:8px 0}</style><style>
html,body{width:100%;height:100%;margin:0!important;padding:0!important;overflow:hidden;background:transparent!important}
#stage{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important;border-radius:0!important;background:transparent!important}
body>header,aside,#wmToolbar,#wmLightToggle,#wmLightPanel,#wmFXToggle,#wmFXPanel,.sub,h1,.views{display:none!important}
</style></head>
<body data-public="true">

<h1>WOJAKMETER · Touch Studio 16</h1>
<p class="sub">Iris por emoción · cuello más grueso · mirada interactiva · v16</p>

<div class="wrap">
  <div id="stage" class="liso">
    <div id="cargando">Loading character…</div>
    <div id="mood">Neutral</div>
    <div id="score" class="mono">50 / 100</div>
  </div>

  <aside>
    <div class="views"><button id="frontView">Frente</button><button id="quarterView">¾</button><button id="profileView">Perfil</button><button id="downloadModel">Descargar GLB</button></div><h2>Estado del mercado</h2>
    <select id="preset"></select><p id="subreading" class="sub" style="margin-top:10px">Espera</p>

    <div class="ctl">
      <label for="valence">valence</label><output id="oV">0.00</output>
      <input type="range" id="valence" min="-1" max="1" step="0.01" value="0">
    </div>
    <div class="ctl">
      <label for="arousal">arousal</label><output id="oA">0.35</output>
      <input type="range" id="arousal" min="0" max="1" step="0.01" value="0.35">
    </div>
    <div class="ctl">
      <label for="tension">tension</label><output id="oT">0.15</output>
      <input type="range" id="tension" min="0" max="1" step="0.01" value="0.15">
    </div>
    <div class="ctl">
      <label for="fatigue">fatigue</label><output id="oF">0.20</output>
      <input type="range" id="fatigue" min="0" max="1" step="0.01" value="0.2">
    </div>

    <h2>Intensidad de prueba</h2>
    <div class="ctl">
      <label for="exag">exageración</label><output id="oE">1.60</output>
      <input type="range" id="exag" min="0.4" max="1.0" step="0.05" value="0.55">
      <span class="why">Pruebas de expresión sobre la misma identidad.</span>
    </div>

    <label style="display:block;margin-top:12px"><input id="fxEnabled" checked type="checkbox"> Efectos de emoción</label>
    <button id="ciclo" type="button">Recorrer las 7 emociones</button>
    <button id="girar" type="button">Giro lento / parar</button>
    <button id="fondo" type="button">Fondo liso / transparente</button>

    <h2>Morfos activos</h2>
    <div class="morfos" id="activos">—</div>
  </aside>
</div>

<script>window.__TEX={"Skin": "./Skin.png", "SkinN": "./SkinN.png", "Eye": "./Eye.png", "Eyelash": "./Eyelash.png", "Teeth": "./Teeth.jpg", "Tongue": "./Tongue.jpg", "SkinR": "./SkinR.png", "HoodieN": "./HoodieN.jpg"};</script>

<script type="module" src="./character-app.js?v=studio-awaken25"></script>
<section id="wmToolbar"><div class="wmViewRow"><button data-wm-view="0">Frente</button><button data-wm-view="0.55">¾</button><button id="wmSweep">Giro lento</button></div><select id="wmEmotionPreview" aria-label="Previsualizar emoción"><option value="market">Estado del mercado</option value="cycle">Recorrer las 7 emociones</option><option value="Frustration">Frustration</option><option value="Concern">Concern</option><option value="Doubt">Doubt</option><option value="Neutral">Neutral</option><option value="Optimism">Optimism</option><option value="Content">Content</option><option value="Euphoria">Euphoria</option></select><small id="wmPreviewStatus">Mercado</small></section><button id="wmLightToggle">Luces y acabado</button><section id="wmLightPanel" hidden aria-label="Controles de iluminación"></section><button id="wmFXToggle">Efectos especiales</button><section id="wmFXPanel" hidden aria-label="Efectos especiales por emoción"></section></body></html>
