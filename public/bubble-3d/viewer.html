<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WojakMeter · Bubble Maps</title><link rel="stylesheet" href="viewer.css?v=1"></head><body>
<div class="toolbar"><label class="sr" for="asset">Choose asset</label><select id="asset"><option value="">Choose asset</option></select><button id="pause" aria-pressed="false">Pause</button><button id="reset">Reset view</button></div>
<div id="stage" aria-label="Drag to orbit the market map, pinch to zoom, tap a coin for details"><div id="logos"></div><div class="axis top">BUOYANT +</div><div class="axis bottom">− HEAVY</div><div id="empty" role="status">Reading market…</div><div id="fallback" hidden><p>3D is unavailable. Select a coin below.</p><div id="list"></div></div></div>
<div class="foot"><span id="status" role="status">Waiting for market data</span><span>Drag to orbit · Pinch to zoom · Tap a coin</span></div>
<section id="detail" hidden aria-label="Coin details"><button id="close" aria-label="Close coin details">×</button><header><img id="coinLogo" alt=""><div><strong id="coinName"></strong><small id="symbol"></small></div></header><div id="price"></div><p id="reading"></p><dl id="metrics"></dl><p class="note">Emotion reflects price change in the selected period. Motion is illustrative.</p><button id="chart">Open market chart ↗</button></section>
<script src="three.min.js?v=1"></script><script src="app.js?v=1"></script></body></html>
