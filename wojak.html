<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WojakMeter · Realista</title>
<style>
:root{
  --bg:#0a0b0f; --panel:#12141b; --line:#232735;
  --ink:#e8eaf0; --dim:#8b93a7; --faint:#565e73;
  --frustration:#E4485C; --concern:#E8848F; --doubt:#CBA5AB;
  --neutral:#B8C0CB; --optimism:#B8E5D0; --content:#7FD9A0; --euphoria:#3BD97A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:20px;
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
h1{font-size:19px;font-weight:650;letter-spacing:-.02em;margin:0 0 4px}
p.sub{color:var(--dim);font-size:13px;margin:0 0 16px;max-width:76ch}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start;max-width:1280px}

/* Escenario transparente */
#stage{position:relative;aspect-ratio:4/5;max-height:80vh;border-radius:16px;
  border:1px solid var(--line);overflow:hidden;
  background:
    linear-gradient(45deg,#171a22 25%,transparent 25%,transparent 75%,#171a22 75%),
    linear-gradient(45deg,#171a22 25%,#0e1017 25%,#0e1017 75%,#171a22 75%);
  background-size:22px 22px;background-position:0 0,11px 11px}
#stage.liso{background:#0d1017}
#stage canvas{display:block;width:100%;height:100%}
#cargando{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);
  font-size:12px;letter-spacing:.1em;text-transform:uppercase}
#mood{position:absolute;left:16px;bottom:14px;font-size:28px;font-weight:700;
  letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#score{position:absolute;right:16px;bottom:18px;font-size:13px;color:var(--dim)}

aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;position:sticky;top:18px;max-height:90vh;overflow:auto}
aside h2{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin:16px 0 8px;font-weight:600}
aside h2:first-child{margin-top:0}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:10px}
.ctl label{font-size:11.5px;color:var(--dim)}
.ctl output{font-size:11px}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:#26d07c;margin:0}
.ctl .why{grid-column:1/-1;font-size:10.5px;color:var(--faint);line-height:1.45}
select,button{font:inherit;font-size:12px;color:var(--ink);background:#1a1d27;
  border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%}
button{cursor:pointer;margin-top:8px}
button:hover{border-color:#3d4870}
.morfos{font-size:10.5px;line-height:1.7;color:var(--faint)}
.morfos b{color:var(--dim);font-weight:500}
@media (max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none}}
body{font-size:16px} .ctl label,select,button{font-size:14px} .sub{font-size:14px!important} .views{display:grid;grid-template-columns:1fr 1fr;gap:6px} #stage.liso{background:#050709} </style>
</head>
<body>

<h1>WOJAKMETER · Realista</h1>
<p class="sub">Respiración continua, temblores y postura según la emoción. Identidad realista.</p>

<div class="wrap">
  <div id="stage" class="liso">
    <div id="cargando">Cargando modelo realista…</div>
    <div id="mood">Neutral</div>
    <div id="score" class="mono">50 / 100</div>
  </div>

  <aside>
    <div class="views"><button id="frontView">Frente</button><button id="quarterView">¾</button><button id="profileView">Perfil</button><button id="downloadModel">Descargar GLB</button></div><h2>Estado del mercado</h2>
    <select id="preset"></select><p id="subreading" class="sub" style="margin-top:10px">Espera</p>

    <div class="ctl">
      <label for="valence">valence</label><output id="oV">0.00</output>
      <input type="range" id="valence" min="-1" max="1" step="0.01" value="0">
    </div>
    <div class="ctl">
      <label for="arousal">arousal</label><output id="oA">0.35</output>
      <input type="range" id="arousal" min="0" max="1" step="0.01" value="0.35">
    </div>
    <div class="ctl">
      <label for="tension">tension</label><output id="oT">0.15</output>
      <input type="range" id="tension" min="0" max="1" step="0.01" value="0.15">
    </div>
    <div class="ctl">
      <label for="fatigue">fatigue</label><output id="oF">0.20</output>
      <input type="range" id="fatigue" min="0" max="1" step="0.01" value="0.2">
    </div>

    <h2>Intensidad de prueba</h2>
    <div class="ctl">
      <label for="exag">exageración</label><output id="oE">1.60</output>
      <input type="range" id="exag" min="0.4" max="1.0" step="0.05" value="0.55">
      <span class="why">Pruebas de expresión sobre la misma identidad.</span>
    </div>

    <label style="display:block;margin-top:12px"><input id="fxEnabled" checked type="checkbox"> Efectos de emoción</label>
    <button id="ciclo" type="button">Recorrer las 7 emociones</button>
    <button id="girar" type="button">Girar / parar</button>
    <button id="fondo" type="button">Fondo liso / transparente</button>

    <h2>Morfos activos</h2>
    <div class="morfos" id="activos">—</div>
  </aside>
</div>

function lienzo(w,h,dibujar){
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  dibujar(c.getContext("2d"), w, h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

const texEstrella = lienzo(128,128,(g,w,h)=>{
  const cx=w/2, cy=h/2, R=w*0.46, r=w*0.16;
  const br=g.createRadialGradient(cx,cy,0,cx,cy,R);
  br.addColorStop(0,"rgba(255,255,235,1)"); br.addColorStop(1,"rgba(255,240,150,0)");
  g.fillStyle=br; g.beginPath(); g.arc(cx,cy,R,0,7); g.fill();
  g.fillStyle="#fffdf0"; g.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2 + i*Math.PI/5, rad=(i%2? r:R*0.86);
    g[i?"lineTo":"moveTo"](cx+Math.cos(a)*rad, cy+Math.sin(a)*rad);
  }
  g.closePath(); g.fill();
});

const texGota = lienzo(64,96,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,w,0);
  gr.addColorStop(0,"rgba(180,215,255,0.15)");
  gr.addColorStop(0.45,"rgba(235,248,255,0.95)");
  gr.addColorStop(1,"rgba(150,195,245,0.15)");
  g.fillStyle=gr;
  g.beginPath();
  g.moveTo(w/2, h*0.06);
  g.bezierCurveTo(w*0.94,h*0.5, w*0.9,h*0.95, w/2,h*0.95);
  g.bezierCurveTo(w*0.1,h*0.95, w*0.06,h*0.5, w/2,h*0.06);
  g.fill();
  g.fillStyle="rgba(255,255,255,0.85)";
  g.beginPath(); g.ellipse(w*0.38,h*0.62,w*0.09,h*0.07,0,0,7); g.fill();
});

function plano(tex, ancho, alto, aditivo){
  const m=new THREE.MeshBasicMaterial({map:tex, transparent:true,
    depthWrite:false, depthTest:true,
    blending: aditivo?THREE.AdditiveBlending:THREE.NormalBlending});
  const p=new THREE.Mesh(new THREE.PlaneGeometry(ancho,alto), m);
  p.renderOrder=20; p.visible=false;
  return p;
}

const estrellas=[], gotas=[], lagrimas=[];
function montarEfectos(padre){
  for(const lado of [1,-1]){
    const e=plano(texEstrella,0.075,0.075,true);
    e.position.set(OJO.x*lado, OJO.y, 0.255);
    padre.add(e); estrellas.push(e);
  }
  for(let i=0;i<5;i++){
    const g=plano(texGota,0.022,0.033,false);
    g.userData={ x:(i%2?1:-1)*(0.10+0.055*Math.random()),
                 y0:0.34-0.05*Math.random(), z:0.24+0.04*Math.random(),
                 vel:0.10+0.07*Math.random(), fase:Math.random() };
    padre.add(g); gotas.push(g);
  }
  for(const lado of [1,-1]){
    const l=plano(texGota,0.020,0.030,false);
    l.userData={ x:lado*(OJO.x-0.028), y0:OJO.y-0.022, z:OJO.z-0.012,
                 vel:0.055, fase:lado>0?0:0.5 };
    padre.add(l); lagrimas.push(l);
  }
}

function attachPath(drop){
 const d=drop.userData,attr=malla.geometry.attributes.position;d.path=[];
 const length=lagrimas.includes(drop)?.26:.42;
 for(let j=0;j<=12;j++){
  const y=d.y0-j/12*length;let nearest=[];
  for(let i=0;i<attr.count;i++){if(attr.getZ(i)<0)continue;const dist=(attr.getX(i)-d.x)**2+(attr.getY(i)-y)**2;nearest.push([dist,i]);}
  nearest.sort((a,b)=>a[0]-b[0]);nearest=nearest.slice(0,3);let total=0;
  for(const p of nearest){p[0]=1/(p[0]+1e-7);total+=p[0];}d.path.push(nearest.map(p=>[p[1],p[0]/total]));
 }
}
const dropVec=new THREE.Vector3(),dropA=new THREE.Vector3(),dropB=new THREE.Vector3();
function pathPoint(anchors,out){out.set(0,0,0);for(const [i,w] of anchors){malla.getVertexPosition(i,dropVec);out.addScaledVector(dropVec,w);}return out;}
function animarEfectos(){
 const enabled=document.getElementById("fxEnabled").checked;
 const weights=liveWeights((suave.valence+1)*50),t=life.time;
 const e=(weights.euphoria||0)*(.4+.6*suave.arousal);
 for(const star of estrellas){star.visible=enabled&&e>.01;star.material.opacity=e;star.scale.setScalar(.9+.1*Math.sin(t*4));star.rotation.z=t*.6;}
 for(const drop of [...gotas,...lagrimas]){
  const tear=lagrimas.includes(drop),d=drop.userData;
  const strength=tear?(weights.frustration||0)*(.35+.65*suave.fatigue):((weights.concern||0)+(weights.doubt||0)*Math.max(0,suave.tension-.45))*suave.tension;
  const p=(t*d.vel+d.fase)%1;
  drop.visible=enabled&&strength>.01;if(!drop.visible)continue;
  if(!d.path)attachPath(drop);
  const f=p*12,k=Math.min(11,Math.floor(f));
  pathPoint(d.path[k],dropA);pathPoint(d.path[k+1],dropB);
  drop.position.copy(dropA.lerp(dropB,f-k));drop.position.z+=.004;
  drop.material.opacity=strength*Math.min(1,p*8)*Math.min(1,(1-p)*8);
 }
}

let proximoParpadeo = 2500, tParpadeo = -99, doble = false;
function parpadeo(t){
  if(t - tParpadeo > proximoParpadeo){
    tParpadeo = t;
    proximoParpadeo = doble ? 180 : (2800 + Math.random()*3700);
    doble = !doble && Math.random() < 0.22;
  }
  const dt = t - tParpadeo;
  if(dt > 160) return 0;
  return Math.sin(Math.min(1, dt/160) * Math.PI);
}

function mirada(t){
  return { x: Math.sin(t*0.00023)*0.55 + Math.sin(t*0.00071)*0.2,
           y: Math.sin(t*0.00017+1.7)*0.35 };
}

const suave={...ejes};
let exag=0.55;

function moodDe(s){ return MOODS.find(([a,b])=>s>=a&&s<=b)||MOODS[3]; }

const EMOTION_POSES={
 frustration:{browDownLeft:.62,browDownRight:.58,eyeSquintLeft:.24,eyeSquintRight:.20,noseSneerLeft:.10,noseSneerRight:.07,mouthPressLeft:.38,mouthPressRight:.35,mouthFrownLeft:.20,mouthFrownRight:.22},
 concern:{browInnerUp:.48,browDownLeft:.09,browDownRight:.12,eyeWideLeft:.09,eyeWideRight:.08,mouthFrownLeft:.18,mouthFrownRight:.20,mouthPressLeft:.08,mouthPressRight:.08},
 doubt:{browOuterUpLeft:.78,browDownRight:.27,eyeSquintRight:.18,eyeSquintLeft:.035,mouthLeft:.07,mouthPressRight:.21,mouthPressLeft:.06},
 neutral:{},
 optimism:{mouthSmileLeft:.19,mouthSmileRight:.17,cheekSquintLeft:.07,cheekSquintRight:.06},
 content:{mouthSmileLeft:.36,mouthSmileRight:.34,cheekSquintLeft:.20,cheekSquintRight:.18,eyeSquintLeft:.09,eyeSquintRight:.08},
 euphoria:{mouthSmileLeft:.68,mouthSmileRight:.64,cheekSquintLeft:.37,cheekSquintRight:.34,eyeSquintLeft:.15,eyeSquintRight:.14,jawOpen:.13,browOuterUpLeft:.12,browOuterUpRight:.10}
};
const ANCHORS=[[0,"frustration"],[10,"frustration"],[27,"concern"],[40,"doubt"],[45,"neutral"],[59,"neutral"],[65,"optimism"],[77,"content"],[93,"euphoria"],[100,"euphoria"]];
function emotionWeights(score){
 score=Math.max(0,Math.min(100,score));let k=0;while(k<ANCHORS.length-2&&score>ANCHORS[k+1][0])k++;
 const [a,an]=ANCHORS[k],[b,bn]=ANCHORS[k+1];let t=Math.max(0,Math.min(1,(score-a)/(b-a)));t=t*t*(3-2*t);const result={};
 for(const n of new Set([...Object.keys(EMOTION_POSES[an]),...Object.keys(EMOTION_POSES[bn])]))result[n]=(EMOTION_POSES[an][n]||0)*(1-t)+(EMOTION_POSES[bn][n]||0)*t;
 return result;
}
function aplicar(){
 if(!malla)return;const w=malla.morphTargetInfluences;w.fill(0);
 const put=(n,v)=>{const i=idx[n];if(i!==undefined)w[i]=Math.max(0,Math.min(1,v));};
 const add=(n,v)=>{const i=idx[n];if(i!==undefined)put(n,w[i]+v);};
 const pose=emotionWeights((suave.valence+1)*50),strength=exag/.55;
 for(const [n,v] of Object.entries(pose))put(n,v*strength*(1-.25*suave.fatigue*Math.max(0,-suave.valence)));
 for(const side of ["Left","Right"]){add("eyeWide"+side,suave.arousal*.055);add("browDown"+side,suave.tension*.075);add("mouthPress"+side,suave.tension*.065);add("eyeBlink"+side,suave.fatigue*.12);}
 put("WM_Breath",life.out.breath);
 add("jawOpen",.008*life.out.breath);
 add("browOuterUpLeft",.012*life.out.micro);
 const pb=life.out.blink;
 for(const side of ["Left","Right"]){const i=idx["eyeBlink"+side];if(i!==undefined)w[i]=Math.max(w[i],pb);}
 for(const mesh of seguidores){const map=mesh.morphTargetDictionary||{};for(const [n,i] of Object.entries(map)){const src=idx[n];mesh.morphTargetInfluences[i]=src===undefined?0:w[src];}}
 const act=Object.entries(idx).filter(([n,i])=>w[i]>.01).map(([n,i])=>`${n}: ${w[i].toFixed(2)}`);
 document.getElementById("activos").textContent=act.join(" · ")||"ninguno";
}

function luzDe(clave){ estadoEfectos(clave); }
function setupLivingRig(){
 matPiel.onBeforeCompile=shader=>{shader.uniforms.wmSaturation=skinSaturation;shader.fragmentShader='uniform float wmSaturation;\n'+shader.fragmentShader;shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>','#include <map_fragment>\n diffuseColor.rgb=mix(vec3(dot(diffuseColor.rgb,vec3(.2126,.7152,.0722))),diffuseColor.rgb,wmSaturation);');};
 matPiel.customProgramCacheKey=()=> 'wm-skin-saturation-v05';matPiel.needsUpdate=true;

 motionRoot=new THREE.Group();headPivot=new THREE.Group();
 const children=[...grupo.children];grupo.add(motionRoot);motionRoot.add(headPivot);headPivot.position.y=-.33;
 for(const obj of children){if(obj.material?.name==='Hoodie')motionRoot.add(obj);else{headPivot.add(obj);obj.position.y+=.33;}}
}
function liveWeights(score){
 let k=0;while(k<ANCHORS.length-2&&score>ANCHORS[k+1][0])k++;
 const [a,n]=ANCHORS[k],[b,m]=ANCHORS[k+1];let f=THREE.MathUtils.clamp((score-a)/(b-a),0,1);f=f*f*(3-2*f);
 const w={};w[n]=(w[n]||0)+1-f;w[m]=(w[m]||0)+f;return w;
}
function updateBody(){
 const o=life.out;if(headPivot){headPivot.rotation.set(o.x,o.y,o.z);motionRoot.position.y=o.lift;}
 const weights=liveWeights((suave.valence+1)*50);let r=0,g=0,b=0,exposure=0;
 skinSaturation.value=1-(weights.concern||0)*.55;
 const n=moodDe(Math.round((suave.valence+1)*50))[3],A=suave.arousal,T=suave.tension,F=suave.fatigue;
 const readings={frustration:F>.75?'Agotamiento':A>.65?'Pánico':'Capitulación',concern:A>.7?'Pico de miedo':F>.55?'Quiebre de confianza':'Presión defensiva',doubt:T>.55?'Confusión':A>.45?'Falso rebote':'Vacilación',neutral:T>.5?'Presión acumulándose':A<.2?'Compresión':'Espera',optimism:F>.4?'Retroceso':T<.2&&A>.55?'Confiado':'Construyéndose',content:T>.4?'Sobreextendido':A>.55?'Fuerza':'Confianza',euphoria:F>.4?'Debilitamiento':T>.5?'Sobrecalentamiento':'Ruptura'};
 document.getElementById('subreading').textContent=readings[n];
 if(motionRoot&&!reducedMotion.matches)motionRoot.position.y+=(weights.euphoria||0)*.0015*Math.exp(5*(Math.cos(life.time*6)-1));

 const mixes={frustration:.85,concern:.55,doubt:.30,neutral:0,optimism:.25,content:.40,euphoria:.70};
 for(const [n,w] of Object.entries(weights)){
  const tint=n==='concern'?[1.10,1.10,1.10]:PIEL[n].tinte;
  const mix=mixes[n]*(.5+.3*suave.arousal+.2*suave.tension);
  r+=w*(1+(tint[0]-1)*mix);g+=w*(1+(tint[1]-1)*mix);b+=w*(1+(tint[2]-1)*mix);exposure+=w*LUZ[n].exp;
 }
 if(matPiel)matPiel.color.setRGB(.82*r,.86*g,.88*b);
 key.color.setHex(0xfff2e8);fill.color.setHex(0x3d4250);rim.color.setHex(0xcfe0ff);amb.color.setHex(0x333a48);
 key.intensity=1.25+.25*suave.arousal;fill.intensity=.5;rim.intensity=.9;amb.intensity=.42;ren.toneMappingExposure=exposure;
}

function etiqueta(){
  const s=Math.round((ejes.valence+1)*50);
  const [,,nombre,clave]=moodDe(s);
  const el=document.getElementById("mood");
  el.textContent=nombre;
  el.style.color=getComputedStyle(document.documentElement).getPropertyValue("--"+clave);
  document.getElementById("score").textContent=`${s} / 100`;
  luzDe(clave);
}

const sal={valence:"oV",arousal:"oA",tension:"oT",fatigue:"oF"};
for(const e of Object.keys(sal)){
  const i=document.getElementById(e);
  i.addEventListener("input",()=>{ ejes[e]=Number(i.value);
    document.getElementById(sal[e]).textContent=ejes[e].toFixed(2); etiqueta(); });
}
const ex=document.getElementById("exag");
ex.addEventListener("input",()=>{ exag=Number(ex.value);
  document.getElementById("oE").textContent=exag.toFixed(2); aplicar(); });

const PRESETS={
 Frustration:{valence:-.80,arousal:.30,tension:.72,fatigue:.85},
 Concern:{valence:-.46,arousal:.58,tension:.62,fatigue:.30},
 Doubt:{valence:-.20,arousal:.35,tension:.35,fatigue:.28},
 Neutral:{valence:0,arousal:.24,tension:.10,fatigue:.15},
 Optimism:{valence:.30,arousal:.52,tension:.14,fatigue:.12},
 Content:{valence:.54,arousal:.40,tension:.10,fatigue:.18},
 Euphoria:{valence:.86,arousal:.88,tension:.22,fatigue:.08}
};
const sel=document.getElementById("preset");
sel.innerHTML=Object.keys(PRESETS).map(k=>`<option\( {k==="Neutral"?" selected":""}> \){k}</option>`).join("");
function ponerPreset(k){
  Object.assign(ejes,PRESETS[k]);
  for(const e of Object.keys(sal)){
    document.getElementById(e).value=ejes[e];
    document.getElementById(sal[e]).textContent=ejes[e].toFixed(2);
  }
  etiqueta();
}
sel.addEventListener("change",()=>ponerPreset(sel.value));

let ciclando=0;
document.getElementById("ciclo").addEventListener("click",()=>{
  clearInterval(ciclando);
  const ks=Object.keys(PRESETS); let i=0;
  sel.value=ks[0]; ponerPreset(ks[0]);
  ciclando=setInterval(()=>{ i++; if(i>=ks.length){clearInterval(ciclando);return;}
    sel.value=ks[i]; ponerPreset(ks[i]); },2400);
});
document.getElementById("girar").addEventListener("click",()=>{ girando=!girando; });
document.getElementById("fondo").addEventListener("click",()=>{ stage.classList.toggle("liso"); });

function medir(){
  const r=stage.getBoundingClientRect();
  ren.setSize(r.width,r.height,false);
  compositor.setSize(r.width,r.height);
  bloom.resolution.set(r.width,r.height);
  cam.aspect=r.width/r.height; cam.updateProjectionMatrix();
}
addEventListener("resize",medir); medir();


for(const [id,angle] of [["frontView",0],["quarterView",0.55],["profileView",Math.PI/2]]) document.getElementById(id).onclick=()=>{girando=false;if(grupo)grupo.rotation.y=angle;};
document.getElementById("downloadModel").onclick=()=>{const u=URL.createObjectURL(new Blob([__glb()],{type:"model/gltf-binary"}));const a=document.createElement("a");a.href=u;a.download="WM_Realista_v05.glb";a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);};
document.getElementById("oE").textContent=exag.toFixed(2);
ponerPreset("Neutral");
let t0=performance.now();
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
function bucle(t){
 requestAnimationFrame(bucle);const dt=Math.max(0,Math.min((t-t0)/1000,.1));t0=t;
 if(document.hidden)return;
 for(const k of Object.keys(ejes))suave[k]+=(ejes[k]-suave[k])*(1-Math.exp(-dt*3));
 life.step(dt,suave,reducedMotion.matches);aplicar();updateBody();animarEfectos();
 if(grupo&&girando)grupo.rotation.y=Math.sin(life.time/3.6)*.65;
 pasoAcabado.uniforms.tiempo.value=life.time;compositor.render();
}
document.addEventListener('visibilitychange',()=>{t0=performance.now();});
window.WojakMeter={setMarket(data){
 if(Number.isFinite(data.marketScore))ejes.valence=THREE.MathUtils.clamp(data.marketScore,0,100)/50-1;
 for(const k of Object.keys(ejes))if(Number.isFinite(data[k]))ejes[k]=THREE.MathUtils.clamp(data[k],k==='valence'?-1:0,1);
 if(Number.isFinite(data.intensity)){exag=THREE.MathUtils.clamp(data.intensity,.4,1);ex.value=exag;document.getElementById('oE').textContent=exag.toFixed(2);}
 for(const k of Object.keys(sal)){document.getElementById(k).value=ejes[k];document.getElementById(sal[k]).textContent=ejes[k].toFixed(2);}etiqueta();
 },getState(){return {axes:{...suave},phase:life.phase,motion:{...life.out}};}};
requestAnimationFrame(bucle);
etiqueta();
</script>
</body>
</html>
